# A food is deleted by a swipe to the left, which asks the system's question once the row is open
# (DESIGN.md, *Lists and rows*). Jest cannot make the swipe (ADR 0011).
appId: com.skrymer.macropilot
---
- runFlow: steps/start.yaml
- runFlow:
    file: steps/add-food.yaml
    env:
      NAME: Milk
      PROTEIN: '3'
      CARBOHYDRATE: '5'
      FAT: '3'

# Swiped open, the system asks; cancelled, the food stays.
- swipe:
    from: 'Milk, .*'
    direction: LEFT
- assertVisible: 'Delete this food?'
- tapOn: 'Cancel'
- assertVisible: 'Milk, .*'

# Swiped open again and answered, the food goes.
- swipe:
    from: 'Milk, .*'
    direction: LEFT
- assertVisible: 'Delete this food?'
- tapOn: 'Delete'
- extendedWaitUntil:
    visible: 'Build your food catalog'
    timeout: 10000
